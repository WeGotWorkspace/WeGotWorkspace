# Team simulation (#1981): the shared-host worker budget. mod_php runs under
# prefork, so at most 5 requests are served at once, like a ~5-worker host.
# KeepAlive is off: on a shared host idle browser connections are held by the
# web server, not by one of the 5 PHP workers. With keep-alive on, six idle
# browser connections pin all five workers for KeepAliveTimeout each.
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    ServerLimit 5
    MaxRequestWorkers 5
</IfModule>
