name: Release WeGotWorkspace

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single source for which cells block publish. Observe is the complement.
  RELEASE_GATE_CELLS: '["zip-sqlite"]'

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cell-lists:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gate: ${{ steps.split.outputs.gate }}
      observe: ${{ steps.split.outputs.observe }}
    steps:
      - id: split
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os
          all_cells = ["zip-sqlite", "zip-mariadb", "docker-sqlite", "docker-mariadb"]
          gate = json.loads(os.environ["RELEASE_GATE_CELLS"])
          if not gate:
              raise SystemExit("RELEASE_GATE_CELLS is empty; zip-sqlite must stay in the gate or publish is skipped")
          unknown = [cell for cell in gate if cell not in all_cells]
          if unknown:
              raise SystemExit(f"unknown gate cells: {unknown}")
          if len(gate) != len(set(gate)):
              raise SystemExit("duplicate cells in RELEASE_GATE_CELLS")
          observe = [cell for cell in all_cells if cell not in gate]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"gate={json.dumps(gate)}\n")
              handle.write(f"observe={json.dumps(observe)}\n")
          PY

  prepare:
    uses: ./.github/workflows/install-e2e-build.yml
    secrets:
      WGW_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.WGW_RELEASE_SIGNING_PRIVATE_KEY }}
    permissions:
      contents: read
      packages: write
    with:
      build_arm64: ${{ startsWith(github.ref, 'refs/tags/') }}
      sign_release: ${{ startsWith(github.ref, 'refs/tags/') }}

  install-gate:
    if: startsWith(github.ref, 'refs/tags/') && needs.cell-lists.outputs.gate != '[]'
    needs: [prepare, cell-lists]
    uses: ./.github/workflows/install-e2e-reusable.yml
    permissions:
      contents: read
      packages: read
    with:
      cells: ${{ needs.cell-lists.outputs.gate }}
      image: ghcr.io/wegotworkspace/wegotworkspace-candidate@${{ needs.prepare.outputs.amd64_digest }}

  install-observe:
    if: startsWith(github.ref, 'refs/tags/') && needs.cell-lists.outputs.observe != '[]'
    needs: [prepare, cell-lists]
    uses: ./.github/workflows/install-e2e-reusable.yml
    permissions:
      contents: read
      packages: read
    with:
      cells: ${{ needs.cell-lists.outputs.observe }}
      image: ghcr.io/wegotworkspace/wegotworkspace-candidate@${{ needs.prepare.outputs.amd64_digest }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, install-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the release ZIP
        uses: actions/download-artifact@v4
        with:
          name: wegotworkspace-deploy-zip
          path: dist/releases

      - name: Promote tested image to release tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AMD64: ghcr.io/wegotworkspace/wegotworkspace-candidate@${{ needs.prepare.outputs.amd64_digest }}
          ARM64: ghcr.io/wegotworkspace/wegotworkspace-candidate@${{ needs.prepare.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          TAGS=(-t "ghcr.io/wegotworkspace/wegotworkspace:${VERSION}")
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS+=(-t ghcr.io/wegotworkspace/wegotworkspace:latest)
          else
            echo "Prerelease ${GITHUB_REF_NAME}: not moving :latest"
          fi
          docker buildx imagetools create "${TAGS[@]}" "$AMD64" "$ARM64"

      - name: Build Docker install bundle
        env:
          WGW_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node tools/build-docker-install-bundle.mjs

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/releases/*.zip
            dist/releases/manifest.json
            dist/releases/manifest.sig
            dist/releases/install
            dist/releases/setup.sh
            dist/releases/docker-compose.yml
            dist/releases/env.example
            dist/releases/wgw-docker-install-*.tar.gz

      - name: Upload bundle for smoke
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/releases
          retention-days: 1

  smoke:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/releases

      - name: Smoke test install stack (compose + migrator + volumes)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/wegotworkspace/wegotworkspace:${VERSION}"
          SMOKE_DIR="${RUNNER_TEMP}/wgw-install-smoke"
          rm -rf "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR"
          docker pull "$IMAGE"
          cp dist/releases/docker-compose.yml "$SMOKE_DIR/docker-compose.yml"
          cp dist/releases/env.example "$SMOKE_DIR/.env"
          sed -i "s|^WGW_IMAGE=.*|WGW_IMAGE=${IMAGE}|" "$SMOKE_DIR/.env"
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=sqlite/' "$SMOKE_DIR/.env"
          sed -i 's/^WGW_WAIT_FOR_DB=.*/WGW_WAIT_FOR_DB=0/' "$SMOKE_DIR/.env"
          sed -i 's/^WGW_DB_HOST=.*/WGW_DB_HOST=/' "$SMOKE_DIR/.env"
          sed -i 's/^WGW_HTTP_PORT=.*/WGW_HTTP_PORT=18080/' "$SMOKE_DIR/.env"
          cd "$SMOKE_DIR"
          compose() { docker compose -f docker-compose.yml --env-file .env "$@"; }
          echo "=== Fresh install: migrator should skip, web should become healthy ==="
          compose up -d
          compose ps -a
          compose logs migrator | tee /tmp/wgw-migrator-fresh.log
          grep -q "skipping schema migration" /tmp/wgw-migrator-fresh.log
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"status":"ok"'; then
              echo "Health check passed."
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "::error::Health check failed."
              compose logs
              exit 1
            fi
            sleep 2
          done
          curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/install/ | grep -qE '200|302'
          echo "=== Installed instance: migrator should run wgw:schema-migrate ==="
          CONTENT_VOL="$(docker volume ls -q | grep '_wgw-content$' | head -1)"
          [ -n "$CONTENT_VOL" ] || { echo "::error::wgw-content volume not found"; compose ps -a; docker volume ls; exit 1; }
          docker run --rm -v "${CONTENT_VOL}:/data" alpine:3.20 \
            sh -c 'mkdir -p /data && date -Iseconds > /data/.installed'
          compose up -d --force-recreate
          compose logs migrator | tee /tmp/wgw-migrator-installed.log
          grep -q "Running wgw:schema-migrate" /tmp/wgw-migrator-installed.log
          echo "=== Config persistence: force-recreate web, health should remain ok ==="
          compose up -d --force-recreate web
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"status":"ok"'; then
              echo "Post-recreate health check passed."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Post-recreate health check failed."
              compose logs web
              exit 1
            fi
            sleep 2
          done
          echo "=== Bare container smoke (image entrypoint only) ==="
          docker run -d --name wgw-install-smoke-bare -p 127.0.0.1:18081:80 \
            -e WGW_WAIT_FOR_DB=0 -e WGW_DB_HOST= "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/v1/health | grep -q '"status":"ok"'; then
              echo "Bare container health check passed."
              docker rm -f wgw-install-smoke-bare
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Bare container health check failed."
              docker logs wgw-install-smoke-bare || true
              docker rm -f wgw-install-smoke-bare
              exit 1
            fi
            sleep 2
          done
          compose down -v
          echo "Install stack smoke tests passed."

  annotate-release:
    needs: [publish, install-observe]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download cell statuses
        uses: actions/download-artifact@v4
        with:
          pattern: install-e2e-cell-*
          merge-multiple: true
          path: cell-results

      - name: Replace the install-cells section in the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          python3 - << 'PY'
          import os, pathlib, subprocess
          tag = os.environ["GITHUB_REF_NAME"]
          body = subprocess.check_output(
              ["gh", "release", "view", tag, "--json", "body", "--jq", ".body"],
              text=True,
          )
          marker = "## Install cells"
          if marker in body:
              body = body.split(marker, 1)[0].rstrip()
          cells = "\n".join(
              path.read_text(encoding="utf-8").strip()
              for path in sorted(pathlib.Path("cell-results").glob("*"))
              if path.is_file()
          )
          section = (
              f"{marker}\n\n"
              "Observe cells do not block this release. A red observe cell resets its promotion count.\n\n"
              f"{cells}\n"
          )
          pathlib.Path("/tmp/release-notes.md").write_text(f"{body}\n\n{section}", encoding="utf-8")
          PY
          gh release edit "$TAG" --notes-file /tmp/release-notes.md

  cleanup:
    needs: prepare
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete candidate tags older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ghcr-delete-old-candidates.sh
