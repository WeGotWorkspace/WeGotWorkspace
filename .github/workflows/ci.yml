name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-server:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck MCP server
        run: pnpm exec turbo run build typecheck --filter=@wgw/mcp-server

  api-quality:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      # Shard 1 also runs greenfield-guard + the Architecture suite; later
      # shards run only their round-robin slice of unit/feature/storage tests.
      - name: API quality gate (shard ${{ matrix.shard }}/2)
        env:
          DONE_GATE_SHARD: ${{ matrix.shard }}/2
        run: pnpm run ci:quality:api

  apps-quality:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright (Storybook Vitest)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm --filter @wgw/apps exec playwright install chromium --with-deps
          else
            pnpm --filter @wgw/apps exec playwright install chromium
          fi

      - name: Apps quality gate
        env:
          # Local pre-push skips unit + jsdom. CI runs both; jsdom shards
          # pool themselves from CPU and memory (see jsdom-concurrency.mjs).
          APPS_DONE_GATE_FULL: "1"
        run: pnpm run ci:quality:apps

  build:
    needs: [api-quality, apps-quality]
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: License policy (production dependencies)
        run: pnpm run check:licenses

      - name: Reject Cursor commit attribution
        if: github.event_name == 'pull_request'
        run: node tools/git/check-commit-range-attribution.mjs "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Reject Cursor PR description attribution
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/git/check-pr-body-attribution.mjs

      - name: Build (Turbo JS, then Composer prune and sync)
        run: pnpm run build

  chromatic:
    if: >-
      vars.CHROMATIC_ENABLED == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      # Build with pnpm and upload that directory so the action does not spawn
      # its own Storybook build through a different package manager.
      # --stats-json writes preview-stats.json. TurboSnap (onlyChanged) traces
      # changed files from that manifest; without it the publish step fails.
      - name: Build Storybook
        working-directory: packages/apps
        run: pnpm exec storybook build --output-dir storybook-static --stats-json

      - name: Publish to Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/apps
          storybookBuildDir: storybook-static
          onlyChanged: true
          # Publish succeeded. Unaccepted visual diffs stay in the Chromatic UI
          # and must not fail this job. main still accepts new baselines.
          exitZeroOnChanges: true
          autoAcceptChanges: "main"

  api-mysql:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wgw_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_mysql, pdo_sqlite, simplexml, zip
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      # PR/push runs only the MySQL parity subset (DB-dialect-relevant tests),
      # split into round-robin shards. The full MySQL suite runs on main +
      # nightly via ci-mysql-full.yml.
      - name: API tests (MySQL parity subset, shard ${{ matrix.shard }}/2)
        env:
          WGW_TEST_DRIVER: mysql
          WGW_TEST_MYSQL_HOST: 127.0.0.1
          WGW_TEST_MYSQL_PORT: 3306
          WGW_TEST_MYSQL_DATABASE: wgw_test
          WGW_TEST_MYSQL_USERNAME: root
          WGW_TEST_MYSQL_PASSWORD: root
          WGW_PHPUNIT_SHARD: ${{ matrix.shard }}/2
        run: composer --working-dir packages/api run test:mysql:parity:shard

  api-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: api-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: pcov

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      - name: PHPUnit clover
        working-directory: packages/api
        run: |
          set -euo pipefail
          mkdir -p build/logs
          php vendor/bin/phpunit -c phpunit.xml --coverage-clover=build/logs/clover.xml
          php -r 'if (!preg_match("/<file\\b/", file_get_contents("build/logs/clover.xml"))) { fwrite(STDERR, "clover lists no files\n"); exit(1); }'

      - uses: actions/upload-artifact@v4
        with:
          name: phpunit-clover
          path: packages/api/build/logs/clover.xml
          if-no-files-found: error

  apps-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: apps-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Vitest unit blob
        working-directory: packages/apps
        run: |
          rm -rf .vitest-reports .coverage-shards coverage
          pnpm exec vitest run --project unit --coverage --reporter=blob --outputFile=.vitest-reports/blob-unit.json --coverage.reportsDirectory=.coverage-shards/unit

      - name: Vitest jsdom blobs
        working-directory: packages/apps
        run: node scripts/run-jsdom.mjs --coverage

      - name: Merge coverage reports
        working-directory: packages/apps
        run: |
          set -euo pipefail
          test -s .vitest-reports/blob-unit.json
          mapfile -t blobs < <(find .vitest-reports -name 'blob-jsdom-*.json' | sort)
          if [[ "${#blobs[@]}" -eq 0 ]]; then
            echo "no jsdom coverage blobs" >&2
            exit 1
          fi
          if ! pnpm exec vitest --merge-reports=.vitest-reports --coverage.enabled --coverage.reporter=lcov,json-summary --coverage.reportsDirectory=coverage; then
            echo "Combined merge failed; writing separate unit and jsdom reports."
            mkdir -p .vitest-reports-unit .vitest-reports-jsdom
            cp .vitest-reports/blob-unit.json .vitest-reports-unit/
            find .vitest-reports -name 'blob-jsdom-*.json' -exec cp {} .vitest-reports-jsdom/ \;
            pnpm exec vitest --merge-reports=.vitest-reports-unit --coverage.enabled --coverage.reporter=lcov,json-summary --coverage.reportsDirectory=coverage/unit
            pnpm exec vitest --merge-reports=.vitest-reports-jsdom --coverage.enabled --coverage.reporter=lcov,json-summary --coverage.reportsDirectory=coverage/jsdom
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: packages/apps/coverage
          if-no-files-found: error
