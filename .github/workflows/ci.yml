name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-server:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck MCP server
        run: pnpm exec turbo run build typecheck --filter=@wgw/mcp-server

      - name: File-size ratchet
        run: node tools/file-size-ratchet.mjs check tools/mcp-server/src

  api-quality:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      # origin/main is the ceiling for the PHPStan baseline sum. A depth-1
      # checkout of the PR head does not include that ref. Pin the refspec
      # so the update does not depend on the remote's default fetch mapping.
      - name: Fetch main for the PHPStan baseline shrink check
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # Shard 1 also runs the file-size ratchet, greenfield-guard, PHPStan
      # level 8, and the Architecture suite; later shards run only their
      # round-robin slice of unit/feature/storage tests.
      - name: API quality gate (shard ${{ matrix.shard }}/2)
        env:
          DONE_GATE_SHARD: ${{ matrix.shard }}/2
        run: pnpm run ci:quality:api

  apps-quality:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Plan-structure lint diffs against origin/main. Depth 1 leaves
          # that ref missing and the check would pass on an empty diff.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright (Storybook Vitest)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm --filter @wgw/apps exec playwright install chromium --with-deps
          else
            pnpm --filter @wgw/apps exec playwright install chromium
          fi

      - name: File-size baseline growth
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          # Call node directly: `pnpm run … -- <sha>` forwards a literal `--` as argv.
          node tools/file-size-ratchet.mjs check-growth "$BASE_SHA"

      - name: Apps quality gate
        env:
          # Local pre-push skips unit + jsdom. CI runs both; jsdom shards
          # pool themselves from CPU and memory (see jsdom-concurrency.mjs).
          APPS_DONE_GATE_FULL: "1"
        run: pnpm run ci:quality:apps

  # Mock-tier Playwright against a Storybook build. The Chromatic job also
  # builds storybook-static, but only when CHROMATIC_ENABLED is set, and it
  # skips merge_group. Building here keeps apps-e2e independent so it can be
  # a required check. Live-app specs stay on playwright.live.config.mjs.
  apps-e2e:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm --filter @wgw/apps exec playwright install chromium --with-deps
          else
            pnpm --filter @wgw/apps exec playwright install chromium
          fi

      - name: Build Storybook
        working-directory: packages/apps
        run: pnpm exec storybook build --output-dir storybook-static

      - name: Mock-tier Playwright
        working-directory: packages/apps
        env:
          WGW_APPS_E2E_STATIC: "1"
        run: pnpm exec playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apps-e2e-traces
          path: packages/apps/test-results
          if-no-files-found: ignore

  build:
    needs: [api-quality, apps-quality]
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: License policy (production dependencies)
        run: pnpm run check:licenses

      - name: Reject Cursor commit attribution
        if: github.event_name == 'pull_request'
        run: node tools/git/check-commit-range-attribution.mjs "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Reject Cursor PR description attribution
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/git/check-pr-body-attribution.mjs

      - name: Build (Turbo JS, then Composer prune and sync)
        run: pnpm run build

  # v0.1.99 → this SHA with seeded users, calendars, drive files, and contacts.
  # Runs on every PR so later migration PRs keep the upgrade path covered.
  upgrade-e2e:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade v0.1.99 to this revision
        run: bash tools/e2e-upgrade-from-v0.1.99.sh

  chromatic:
    if: >-
      vars.CHROMATIC_ENABLED == 'true' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      # Actions secrets are hidden from dependabot[bot]. The Chromatic CLI
      # exits "Missing project token" when CHROMATIC_PROJECT_TOKEN is empty,
      # which failed this job after a full Storybook build. Skip publish then.
      - name: Detect Chromatic project token
        id: chromatic-token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CHROMATIC_PROJECT_TOKEN is unset. Skipping Storybook publish."
          fi

      - uses: actions/checkout@v7
        if: steps.chromatic-token.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        if: steps.chromatic-token.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.chromatic-token.outputs.present == 'true'
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS workspace
        if: steps.chromatic-token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Build with pnpm and upload that directory so the action does not spawn
      # its own Storybook build through a different package manager.
      # --stats-json writes preview-stats.json. TurboSnap (onlyChanged) traces
      # changed files from that manifest; without it the publish step fails.
      - name: Build Storybook
        if: steps.chromatic-token.outputs.present == 'true'
        working-directory: packages/apps
        run: pnpm exec storybook build --output-dir storybook-static --stats-json

      - name: Publish to Chromatic
        if: steps.chromatic-token.outputs.present == 'true'
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/apps
          storybookBuildDir: storybook-static
          onlyChanged: true
          # Publish succeeded. Unaccepted visual diffs stay in the Chromatic UI
          # and must not fail this job. main still accepts new baselines.
          exitZeroOnChanges: true
          autoAcceptChanges: "main"

  api-mysql:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wgw_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_mysql, pdo_sqlite, simplexml, zip
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      # PR/push runs only the MySQL parity subset (DB-dialect-relevant tests),
      # split into round-robin shards. The full MySQL suite runs on main +
      # nightly via ci-mysql-full.yml.
      - name: API tests (MySQL parity subset, shard ${{ matrix.shard }}/2)
        env:
          WGW_TEST_DRIVER: mysql
          WGW_TEST_MYSQL_HOST: 127.0.0.1
          WGW_TEST_MYSQL_PORT: 3306
          WGW_TEST_MYSQL_DATABASE: wgw_test
          WGW_TEST_MYSQL_USERNAME: root
          WGW_TEST_MYSQL_PASSWORD: root
          WGW_PHPUNIT_SHARD: ${{ matrix.shard }}/2
        run: composer --working-dir packages/api run test:mysql:parity:shard

  api-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: api-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: pcov

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      - name: PHPUnit clover
        working-directory: packages/api
        run: |
          set -euo pipefail
          mkdir -p build/logs
          php vendor/bin/phpunit -c phpunit.xml --coverage-clover=build/logs/clover.xml
          php -r 'if (!preg_match("/<file\\b/", file_get_contents("build/logs/clover.xml"))) { fwrite(STDERR, "clover lists no files\n"); exit(1); }'

      - uses: actions/upload-artifact@v7
        with:
          name: phpunit-clover
          path: packages/api/build/logs/clover.xml
          if-no-files-found: error

  apps-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: apps-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Vitest unit blob
        working-directory: packages/apps
        run: |
          rm -rf .vitest-reports .coverage-shards coverage
          pnpm exec vitest run --project unit --coverage --reporter=blob --outputFile=.vitest-reports/blob-unit.json --coverage.reportsDirectory=.coverage-shards/unit

      - name: Vitest jsdom blobs
        working-directory: packages/apps
        run: node scripts/run-jsdom.mjs --coverage

      - name: Merge coverage reports
        working-directory: packages/apps
        run: |
          set -euo pipefail
          test -s .vitest-reports/blob-unit.json
          mapfile -t blobs < <(find .vitest-reports -name 'blob-jsdom-*.json' | sort)
          if [[ "${#blobs[@]}" -eq 0 ]]; then
            echo "no jsdom coverage blobs" >&2
            exit 1
          fi
          if ! pnpm exec vitest --merge-reports=.vitest-reports --coverage.enabled --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reportsDirectory=coverage; then
            echo "Combined merge failed; writing separate unit and jsdom reports."
            mkdir -p .vitest-reports-unit .vitest-reports-jsdom
            cp .vitest-reports/blob-unit.json .vitest-reports-unit/
            find .vitest-reports -name 'blob-jsdom-*.json' -exec cp {} .vitest-reports-jsdom/ \;
            pnpm exec vitest --merge-reports=.vitest-reports-unit --coverage.enabled --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reportsDirectory=coverage/unit
            pnpm exec vitest --merge-reports=.vitest-reports-jsdom --coverage.enabled --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reportsDirectory=coverage/jsdom
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: packages/apps/coverage
          if-no-files-found: error

  coverage-ratchet:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [api-coverage, apps-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download API coverage
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: phpunit-clover
          path: packages/api/build/logs

      - name: Download apps coverage
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: vitest-coverage
          path: packages/apps/coverage

      - name: Check coverage ratchet
        id: check
        run: |
          set +e
          # One run. JSON on stdout, human text on stderr. tee waits before the step exits.
          node tools/coverage-ratchet.mjs check --json > coverage-ratchet.json 2> >(tee coverage-ratchet.txt >&2)
          CODE=$?
          wait
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [[ $CODE -eq 2 ]]; then
            echo "Baseline proposal"
          elif [[ $CODE -eq 0 ]]; then
            echo "Coverage stable"
          elif [[ $CODE -eq 1 ]]; then
            echo "Coverage ratchet check failed"
          else
            echo "Coverage ratchet check failed with exit $CODE"
            exit "$CODE"
          fi

      - name: Report coverage regression
        if: steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh label create coverage-regression --color d73a4a --description "Coverage regression on main" --force

          ISSUE_NUMBER=$(gh issue list --label "coverage-regression" --state open --json number --jq '.[0].number // empty')

          # Quoted pieces only. The saved report is appended as data, so backticks
          # and $(...) in the check output are not command substitutions.
          BODY_FILE=$(mktemp)
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          {
            printf '%s\n' "## Coverage Regression Detected" ""
            printf '%s\n' "**Run:** ${{ github.run_id }}"
            printf '%s\n' "**Commit:** ${{ github.sha }}"
            printf '%s\n' "**Date:** ${DATE}" ""
            printf '%s\n' '```'
            cat coverage-ratchet.txt
            printf '%s\n' '```' ""
            printf '%s\n' "Coverage per package can only go up. Please investigate and fix the regression."
          } > "$BODY_FILE"

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$BODY_FILE"
            echo "Commented on existing issue #$ISSUE_NUMBER"
          else
            gh issue create \
              --title "Coverage regression detected on main" \
              --label "coverage-regression" \
              --body-file "$BODY_FILE"
            echo "Opened new coverage-regression issue"
          fi

          exit 1

      - name: Propose baseline increase
        if: steps.check.outputs.exit_code == '2'
        run: |
          set -euo pipefail

          node tools/coverage-ratchet.mjs update

          {
            echo "## Coverage Baseline Proposal"
            echo ""
            echo "Existing keys stay at max(baseline, current). A drop is not written into the baseline."
            echo ""

            if jq -e '.increases | length > 0' coverage-ratchet.json >/dev/null; then
              echo "**Increases:**"
              echo ""
              echo "| Package | From | To |"
              echo "|---------|------|-----|"
              jq -r '.increases[] | "| `" + .pkg + "` | " + (.from | tostring) + "% | " + (.to | tostring) + "% |"' coverage-ratchet.json
              echo ""
            fi

            if jq -e '.proposals | length > 0' coverage-ratchet.json >/dev/null; then
              echo "**New packages:**"
              echo ""
              echo "| Package | Coverage |"
              echo "|---------|----------|"
              jq -r '.proposals[] | "| `" + .pkg + "` | " + (.pct | tostring) + "% |"' coverage-ratchet.json
              echo ""
            fi

            if jq -e '.missing | length > 0' coverage-ratchet.json >/dev/null; then
              echo "**Baseline keys absent from the report:**"
              echo ""
              jq -r '.missing[] | "- `" + . + "`"' coverage-ratchet.json
              echo ""
            fi

            echo "Download the \`coverage-baseline-proposal\` artifact and commit it to \`tools/coverage-baseline.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline proposal
        if: steps.check.outputs.exit_code == '2'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline-proposal
          path: tools/coverage-baseline.json
