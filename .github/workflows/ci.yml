name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the review loop's hand-over label starts the waiting CI.
    types: [opened, synchronize, reopened, labeled]
  merge_group:

# Two tiers. Pull requests run the fast checks: mcp-server, api-quality,
# apps-quality, build, chromatic. The heavy jobs (apps-e2e, api-mysql,
# upgrade-e2e, install-zip-sqlite) run in the merge queue. apps-e2e and
# api-mysql also run on pushes to main; upgrade-e2e and install-zip-sqlite
# do not (the install workflow covers main). The queue only waits for
# required checks: apps-e2e is one, and build waits for the other three, so
# a failing heavy job blocks the merge. A pull request labeled run-full-ci
# runs the heavy jobs too, from its next CI run that the gate lets through
# (a human push or a hand-over label; adding run-full-ci alone starts
# nothing). apps-e2e is a required check, so on a pull request it still
# starts and reports success without work: a job skipped by its `if` would
# report under its unevaluated name and never satisfy the check.
#
# Any other label starts a run that does nothing. Its own group keeps it from
# cancelling the PR's CI. The label names match review-loop-ci-gate.yml.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event.action == 'labeled' &&
      !contains(fromJSON('["ready-for-human","needs-human"]'), github.event.label.name) &&
      github.run_id ||
      github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Waits while the review loop works on a PR; see review-loop-ci-gate.yml.
  gate:
    uses: ./.github/workflows/review-loop-ci-gate.yml

  mcp-server:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck MCP server
        run: pnpm exec turbo run build typecheck --filter=@wgw/mcp-server

      - name: File-size ratchet
        run: node tools/file-size-ratchet.mjs check tools/mcp-server/src

  api-quality:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      # origin/main is the ceiling for the PHPStan baseline sum. A depth-1
      # checkout of the PR head does not include that ref. Pin the refspec
      # so the update does not depend on the remote's default fetch mapping.
      - name: Fetch main for the PHPStan baseline shrink check
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # Shard 1 also runs the file-size ratchet, greenfield-guard, PHPStan
      # level 8, and the Architecture suite; later shards run only their
      # round-robin slice of unit/feature/storage tests.
      - name: API quality gate (shard ${{ matrix.shard }}/2)
        env:
          DONE_GATE_SHARD: ${{ matrix.shard }}/2
        run: pnpm run ci:quality:api

  apps-quality:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Plan-structure lint diffs against origin/main. Depth 1 leaves
          # that ref missing and the check would pass on an empty diff.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright (Storybook Vitest)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm --filter @wgw/apps exec playwright install chromium --with-deps
          else
            pnpm --filter @wgw/apps exec playwright install chromium
          fi

      - name: File-size baseline growth
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # No --depth: a shallow fetch grafts history onto this depth-0 checkout,
          # and when the base sha is not on main (a pull request onto an
          # integration branch) the later plan-structure lint can no longer reach
          # origin/main and refuses to run.
          git fetch origin "$BASE_SHA"
          # Call node directly: `pnpm run … -- <sha>` forwards a literal `--` as argv.
          node tools/file-size-ratchet.mjs check-growth "$BASE_SHA"

      - name: Apps quality gate
        env:
          # Local pre-push skips unit + jsdom. CI runs both; jsdom shards
          # pool themselves from CPU and memory (see jsdom-concurrency.mjs).
          APPS_DONE_GATE_FULL: "1"
        run: pnpm run ci:quality:apps

  # Mock-tier Playwright against a Storybook build. The Chromatic job also
  # builds storybook-static, but only when CHROMATIC_ENABLED is set, and it
  # skips merge_group. Building here keeps apps-e2e independent so it can be
  # a required check. Live-app specs stay on playwright.live.config.mjs
  # and run from nightly-live-e2e.yml (not this pull-request workflow).
  # Heavy tier (see the top of this file): on a pull request every step but
  # the first is skipped, so the required check reports without work.
  apps-e2e:
    name: apps-e2e${{ needs.gate.outputs.run != 'true' && ' (waits for the review loop)' || '' }}
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEAVY: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
    steps:
      - name: Heavy tier
        run: |
          if [ "$HEAVY" = true ]; then
            echo "Running mock-tier Playwright."
          else
            echo "apps-e2e runs in the merge queue. Label the PR run-full-ci to run it here." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - uses: pnpm/action-setup@v6.1.1
        if: env.HEAVY == 'true'

      - uses: actions/setup-node@v7
        if: env.HEAVY == 'true'
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS workspace
        if: env.HEAVY == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Chromium
        if: env.HEAVY == 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm --filter @wgw/apps exec playwright install chromium --with-deps
          else
            pnpm --filter @wgw/apps exec playwright install chromium
          fi

      - name: Build Storybook
        if: env.HEAVY == 'true'
        working-directory: packages/apps
        run: pnpm exec storybook build --output-dir storybook-static

      - name: Mock-tier Playwright
        if: env.HEAVY == 'true'
        working-directory: packages/apps
        env:
          WGW_APPS_E2E_STATIC: "1"
        run: pnpm exec playwright test

      - name: Upload Playwright traces
        if: failure() && env.HEAVY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apps-e2e-traces
          path: packages/apps/test-results
          if-no-files-found: ignore

  # build is a required check, so it also carries the heavy tier: the merge
  # queue only waits for required checks. It needs api-mysql, upgrade-e2e and
  # install-zip-sqlite, and fails when any job it needs failed or was
  # cancelled. Skipped counts as passed (a pull request without run-full-ci,
  # or upgrade-e2e and install-zip-sqlite on a push to main).
  # !cancelled() instead of the default success(): with success() a failed
  # need would skip build, and a skipped build reports under its unevaluated
  # name, so the required check would wait forever instead of failing.
  build:
    name: build${{ needs.gate.outputs.run != 'true' && ' (waits for the review loop)' || '' }}
    needs: [gate, api-quality, apps-quality, api-mysql, upgrade-e2e, install-zip-sqlite]
    if: >-
      !cancelled() &&
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      - name: Jobs build needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::A job that build needs failed or was cancelled (see the list above). In the merge queue this includes api-mysql, upgrade-e2e and install-zip-sqlite."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: License policy (production dependencies)
        run: pnpm run check:licenses

      - name: Reject Cursor commit attribution
        if: github.event_name == 'pull_request'
        run: node tools/git/check-commit-range-attribution.mjs "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Reject Cursor PR description attribution
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/git/check-pr-body-attribution.mjs

      - name: Build (Turbo JS, then Composer prune and sync)
        run: pnpm run build

      # #1628: demo data from src/lib/api/mock/ must not reach the production bundle.
      - name: No mock data in the app bundle
        run: node tools/check-dist-mock-markers.mjs

  # v0.1.99 → this SHA with seeded users, calendars, notes, tasks, drive files, and contacts.
  # The merge queue (and pull requests labeled run-full-ci) only. Pushes to
  # main use the install workflow's upgrade job, which targets the candidate
  # release image.
  upgrade-e2e:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' && github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: upgrade-e2e-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            upgrade-e2e-composer-

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx type=gha reads ACTIONS_RUNTIME_TOKEN and ACTIONS_CACHE_URL.
      # The runner injects those into action steps only, so export them
      # before the shell step that runs docker buildx.
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Upgrade v0.1.99 to this revision
        env:
          WGW_UPGRADE_DOCKER_CACHE: gha
        run: bash tools/e2e-upgrade.sh

  # Fresh install of a release ZIP from this revision: the zip-sqlite cell of
  # tools/e2e-install-matrix.sh, which the Edge build also runs after a merge.
  # It fails when the install leaves wgw-content in the web root (#1803).
  # Builds an unsigned ZIP and serves it with PHP's built-in server: no
  # Docker, no signing key, nothing published. The merge queue (and pull
  # requests labeled run-full-ci) only; on pushes to main edge.yml runs the
  # same cell.
  install-zip-sqlite:
    name: install-zip-sqlite${{ needs.gate.outputs.run != 'true' && ' (waits for the review loop)' || '' }}
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' && github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Build (Turbo JS, then Composer prune and sync)
        run: pnpm run build

      - name: Build unsigned release ZIP
        run: node tools/build-wegotworkspace-release.mjs

      # Same browser cache as apps-quality and apps-e2e (one Playwright version
      # in the lockfile). The runner image already has Chromium's system
      # libraries, so --with-deps (apt) runs only on a cache miss. On
      # 2026-11-11 apt could not resolve *.ubuntu.com for over an hour, which
      # failed this job in every merge-queue run.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm --filter @wgw/api-e2e exec playwright install chromium --with-deps
          else
            pnpm --filter @wgw/api-e2e exec playwright install chromium
          fi

      - name: Fresh ZIP install (SQLite)
        env:
          CHANNEL: zip
          DB: sqlite
        run: bash tools/e2e-install-matrix.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-install-zip-sqlite
          path: tools/api-e2e/test-results
          retention-days: 3
          if-no-files-found: ignore

  chromatic:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      vars.CHROMATIC_ENABLED == 'true' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      # Actions secrets are hidden from dependabot[bot]. The Chromatic CLI
      # exits "Missing project token" when CHROMATIC_PROJECT_TOKEN is empty,
      # which failed this job after a full Storybook build. Skip publish then.
      - name: Detect Chromatic project token
        id: chromatic-token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CHROMATIC_PROJECT_TOKEN is unset. Skipping Storybook publish."
          fi

      - uses: actions/checkout@v7
        if: steps.chromatic-token.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1
        if: steps.chromatic-token.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.chromatic-token.outputs.present == 'true'
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS workspace
        if: steps.chromatic-token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Build with pnpm and upload that directory so the action does not spawn
      # its own Storybook build through a different package manager.
      # --stats-json writes preview-stats.json. TurboSnap (onlyChanged) traces
      # changed files from that manifest; without it the publish step fails.
      - name: Build Storybook
        if: steps.chromatic-token.outputs.present == 'true'
        working-directory: packages/apps
        run: pnpm exec storybook build --output-dir storybook-static --stats-json

      - name: Publish to Chromatic
        if: steps.chromatic-token.outputs.present == 'true'
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/apps
          storybookBuildDir: storybook-static
          onlyChanged: true
          # Publish succeeded. Unaccepted visual diffs stay in the Chromatic UI
          # and must not fail this job. main still accepts new baselines.
          exitZeroOnChanges: true
          autoAcceptChanges: "main"

  # Heavy tier: the merge queue, pushes to main, and pull requests labeled
  # run-full-ci.
  api-mysql:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')) &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-full-ci'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wgw_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, json, mbstring, pdo, pdo_mysql, pdo_sqlite, simplexml, zip
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install yjs for collab round-trip tests
        run: bash tools/install-api-test-yjs.sh

      # This job runs only the MySQL parity subset (DB-dialect-relevant tests),
      # split into round-robin shards. The full MySQL suite runs on main +
      # nightly via ci-mysql-full.yml.
      - name: API tests (MySQL parity subset, shard ${{ matrix.shard }}/2)
        env:
          WGW_TEST_DRIVER: mysql
          WGW_TEST_MYSQL_HOST: 127.0.0.1
          WGW_TEST_MYSQL_PORT: 3306
          WGW_TEST_MYSQL_DATABASE: wgw_test
          WGW_TEST_MYSQL_USERNAME: root
          WGW_TEST_MYSQL_PASSWORD: root
          WGW_PHPUNIT_SHARD: ${{ matrix.shard }}/2
        run: composer --working-dir packages/api run test:mysql:parity:shard

  # One PHPUnit process for the whole suite outgrew the 45-minute limit. It
  # took 26 minutes at 6952 tests (2026-11-04) and 34 to over 45 at 7366
  # (2026-11-11): the time grew much faster than the test count. The suite
  # now runs in round-robin file shards (scripts/phpunit-shard.php).
  # Each shard writes --coverage-php; api-coverage merges them into one clover
  # file with php-code-coverage's own merge, so coverage-ratchet reads the same
  # report as before.
  api-coverage-shard:
    name: api-coverage (shard ${{ matrix.shard }}/4)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The shard number keeps the four legs of one run from cancelling each other.
    concurrency:
      group: api-coverage-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: pcov

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env for tests
        run: |
          cp packages/api/.env.example packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install yjs for collab round-trip tests
        run: bash tools/install-api-test-yjs.sh

      - name: PHPUnit coverage (shard ${{ matrix.shard }}/4)
        working-directory: packages/api
        run: |
          set -euo pipefail
          mkdir -p build/coverage
          php scripts/phpunit-shard.php --config=phpunit.xml --shard=${{ matrix.shard }}/4 -- --coverage-php=build/coverage/shard-${{ matrix.shard }}.cov

      - uses: actions/upload-artifact@v7
        with:
          name: phpunit-coverage-shard-${{ matrix.shard }}
          path: packages/api/build/coverage/shard-${{ matrix.shard }}.cov
          if-no-files-found: error
          retention-days: 3

  api-coverage:
    needs: api-coverage-shard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: api-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The clover report reads the sources under the same absolute paths the
      # shards ran from, so this job checks out the same commit.
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Download coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: phpunit-coverage-shard-*
          path: packages/api/build/coverage
          merge-multiple: true

      - name: Merge shards into clover
        working-directory: packages/api
        run: |
          set -euo pipefail
          mapfile -t shards < <(find build/coverage -name 'shard-*.cov' | sort)
          if [[ "${#shards[@]}" -ne 4 ]]; then
            echo "expected 4 coverage shards, found ${#shards[@]}" >&2
            exit 1
          fi
          php -d memory_limit=4G scripts/merge-coverage.php build/logs/clover.xml "${shards[@]}"
          php -r 'if (!preg_match("/<file\\b/", file_get_contents("build/logs/clover.xml"))) { fwrite(STDERR, "clover lists no files\n"); exit(1); }'

      - uses: actions/upload-artifact@v7
        with:
          name: phpunit-clover
          path: packages/api/build/logs/clover.xml
          if-no-files-found: error

  apps-coverage:
    # A pull request runs this job only while it carries run-apps-coverage,
    # on its next CI run. Adding the label does not start one.
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'run-apps-coverage')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: apps-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Vitest unit blob
        working-directory: packages/apps
        # `default` prints a failing test to this log; `blob` alone only exits 1.
        run: |
          rm -rf .vitest-reports .coverage-shards coverage
          pnpm exec vitest run --project unit --coverage --reporter=default --reporter=blob --outputFile=.vitest-reports/blob-unit.json --coverage.reportsDirectory=.coverage-shards/unit

      - name: Vitest jsdom blobs
        working-directory: packages/apps
        run: node scripts/run-jsdom.mjs --coverage

      - name: Merge coverage reports
        working-directory: packages/apps
        run: |
          set -euo pipefail
          test -s .vitest-reports/blob-unit.json
          mapfile -t blobs < <(find .vitest-reports -name 'blob-jsdom-*.json' | sort)
          if [[ "${#blobs[@]}" -eq 0 ]]; then
            echo "no jsdom coverage blobs" >&2
            exit 1
          fi
          if ! pnpm exec vitest --merge-reports=.vitest-reports --coverage.enabled --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reportsDirectory=coverage; then
            echo "Combined merge failed; writing separate unit and jsdom reports."
            mkdir -p .vitest-reports-unit .vitest-reports-jsdom
            cp .vitest-reports/blob-unit.json .vitest-reports-unit/
            find .vitest-reports -name 'blob-jsdom-*.json' -exec cp {} .vitest-reports-jsdom/ \;
            pnpm exec vitest --merge-reports=.vitest-reports-unit --coverage.enabled --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reportsDirectory=coverage/unit
            pnpm exec vitest --merge-reports=.vitest-reports-jsdom --coverage.enabled --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reportsDirectory=coverage/jsdom
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: packages/apps/coverage
          if-no-files-found: error

      # Fallback only. The default reporter in the job log is the diagnosis.
      # One shard blob is about 18 MB, so 54 shards plus unit is about 1 GB.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vitest-reports
          path: packages/apps/.vitest-reports
          if-no-files-found: ignore
          retention-days: 3

  coverage-ratchet:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [api-coverage, apps-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download API coverage
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: phpunit-clover
          path: packages/api/build/logs

      - name: Download apps coverage
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vitest-coverage
          path: packages/apps/coverage

      - name: Check coverage ratchet
        id: check
        run: |
          set +e
          # One run. JSON on stdout, human text on stderr. tee waits before the step exits.
          node tools/coverage-ratchet.mjs check --json > coverage-ratchet.json 2> >(tee coverage-ratchet.txt >&2)
          CODE=$?
          wait
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [[ $CODE -eq 2 ]]; then
            echo "Baseline proposal"
          elif [[ $CODE -eq 0 ]]; then
            echo "Coverage stable"
          elif [[ $CODE -eq 1 ]]; then
            echo "Coverage ratchet check failed"
          else
            echo "Coverage ratchet check failed with exit $CODE"
            exit "$CODE"
          fi

      - name: Report coverage regression
        if: steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh label create coverage-regression --color d73a4a --description "Coverage regression on main" --force

          ISSUE_NUMBER=$(gh issue list --label "coverage-regression" --state open --json number --jq '.[0].number // empty')

          # Quoted pieces only. The saved report is appended as data, so backticks
          # and $(...) in the check output are not command substitutions.
          BODY_FILE=$(mktemp)
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          {
            printf '%s\n' "## Coverage Regression Detected" ""
            printf '%s\n' "**Run:** ${{ github.run_id }}"
            printf '%s\n' "**Commit:** ${{ github.sha }}"
            printf '%s\n' "**Date:** ${DATE}" ""
            printf '%s\n' '```'
            cat coverage-ratchet.txt
            printf '%s\n' '```' ""
            printf '%s\n' "Coverage per package can only go up. Please investigate and fix the regression."
          } > "$BODY_FILE"

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$BODY_FILE"
            echo "Commented on existing issue #$ISSUE_NUMBER"
          else
            gh issue create \
              --title "Coverage regression detected on main" \
              --label "coverage-regression" \
              --body-file "$BODY_FILE"
            echo "Opened new coverage-regression issue"
          fi

          exit 1

      - name: Propose baseline increase
        if: steps.check.outputs.exit_code == '2'
        run: |
          set -euo pipefail

          node tools/coverage-ratchet.mjs update

          {
            echo "## Coverage Baseline Proposal"
            echo ""
            echo "Existing keys stay at max(baseline, current). A drop is not written into the baseline."
            echo ""

            if jq -e '.increases | length > 0' coverage-ratchet.json >/dev/null; then
              echo "**Increases:**"
              echo ""
              echo "| Package | From | To |"
              echo "|---------|------|-----|"
              jq -r '.increases[] | "| `" + .pkg + "` | " + (.from | tostring) + "% | " + (.to | tostring) + "% |"' coverage-ratchet.json
              echo ""
            fi

            if jq -e '.proposals | length > 0' coverage-ratchet.json >/dev/null; then
              echo "**New packages:**"
              echo ""
              echo "| Package | Coverage |"
              echo "|---------|----------|"
              jq -r '.proposals[] | "| `" + .pkg + "` | " + (.pct | tostring) + "% |"' coverage-ratchet.json
              echo ""
            fi

            if jq -e '.missing | length > 0' coverage-ratchet.json >/dev/null; then
              echo "**Baseline keys absent from the report:**"
              echo ""
              jq -r '.missing[] | "- `" + . + "`"' coverage-ratchet.json
              echo ""
            fi

            echo "Download the \`coverage-baseline-proposal\` artifact and commit it to \`tools/coverage-baseline.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline proposal
        if: steps.check.outputs.exit_code == '2'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline-proposal
          path: tools/coverage-baseline.json
