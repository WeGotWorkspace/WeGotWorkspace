name: Review loop - fix

# Fixer half of the automated review loop; the reviewer is review-loop-review.yml.
# Setup, vendor swap, and design notes: .github/review-loop/README.md.
#
# Runs on change requests from the loop's own bot. The agent edits files in
# the working tree; the job commits them as one signed commit through the
# GitHub API (main requires signed commits). That push is a `synchronize` by
# the bot, which re-runs the review.
#
# Brake: after MAX_ROUNDS change requests in one cycle the loop labels the PR
# needs-human and stops. A cycle starts at the PR's last "ready for review".
# A polish round (an approval that lists polish) runs once per cycle and does
# not count toward MAX_ROUNDS.
#
# This file only decides when to run. GitHub reads it from the PR's test merge,
# which can lag behind main, so the logic lives in review-loop-fix-job.yml,
# called at @main.

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: review-loop-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    # Kept broad on purpose: the job decides whether this review starts a fix
    # round, a polish round, or nothing, so that logic lives on main.
    if: >-
      github.event.review.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: WeGotWorkspace/WeGotWorkspace/.github/workflows/review-loop-fix-job.yml@main
    secrets: inherit
