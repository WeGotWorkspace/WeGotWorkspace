name: Install e2e build

on:
  workflow_call:
    inputs:
      build_arm64:
        description: Also push a linux/arm64 candidate for imagetools
        type: boolean
        default: false
    outputs:
      version:
        description: Release version without the leading v
        value: ${{ jobs.assets.outputs.version }}
      amd64_digest:
        description: ghcr.io image digest of the amd64 candidate
        value: ${{ jobs.candidate.outputs.digest }}
      arm64_digest:
        description: ghcr.io image digest of the arm64 candidate, when built
        value: ${{ jobs.arm64.outputs.digest }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_mysql, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Require signed annotated tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TYPE="$(git cat-file -t "$TAG")"
          if [[ "$TYPE" != "tag" ]]; then
            echo "::error::${TAG} is not an annotated tag."
            exit 1
          fi
          git cat-file -p "$TAG" > /tmp/tag-object.txt
          if ! grep -Eq 'BEGIN (PGP|SSH) SIGNATURE' /tmp/tag-object.txt; then
            echo "::error::${TAG} is not signed."
            exit 1
          fi

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: License policy (production dependencies)
        run: pnpm run check:licenses

      - name: Build monorepo
        run: pnpm run build

      - name: Resolve release version
        id: release_version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(tr -d '\n' < apps/wegotworkspace/VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release assets
        env:
          WGW_RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
          WGW_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.WGW_RELEASE_SIGNING_PRIVATE_KEY }}
        run: node tools/build-wegotworkspace-release.mjs

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: wegotworkspace-deploy-zip
          path: dist/releases
          retention-days: 1
          if-no-files-found: error

  candidate:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the release ZIP
        uses: actions/download-artifact@v4
        with:
          name: wegotworkspace-deploy-zip
          path: dist/releases

      - name: Push amd64 candidate
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/install/Dockerfile.runtime
          push: true
          platforms: linux/amd64
          tags: ghcr.io/wegotworkspace/wegotworkspace-candidate:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  arm64:
    if: inputs.build_arm64
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the release ZIP
        uses: actions/download-artifact@v4
        with:
          name: wegotworkspace-deploy-zip
          path: dist/releases

      - name: Push arm64 candidate
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/install/Dockerfile.runtime
          push: true
          platforms: linux/arm64
          tags: ghcr.io/wegotworkspace/wegotworkspace-candidate:sha-${{ github.sha }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
