name: Install e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/install/**"
      - "packages/api/app/Services/Installer/**"
      # StateController, BootstrapController, and ActionController live in this directory.
      - "packages/api/app/Http/Controllers/Api/V1/Installer/**"
      - "packages/api/app/Http/Requests/Api/V1/Installer*"
      - "packages/api/app/Ui/UiStaticServer.php"
      - "apps/wegotworkspace/index.php"
      - "tools/api-e2e/e2e/install*.spec.ts"
      - "tools/api-e2e/playwright.config.mjs"
      - "packages/apps/src/installer-core/**"
      - "packages/apps/src/login-core/**"
      - "tools/build-wegotworkspace-release.mjs"
      - "tools/e2e-install-matrix.sh"
      - "tools/e2e-upgrade.sh"
      - "tools/upgrade-e2e/**"
      - "docker/install/Dockerfile.upgrade-target"
      - "tools/ghcr-delete-old-candidates.sh"
      - "package.json"
      - ".github/workflows/install-e2e.yml"
      - ".github/workflows/install-e2e-reusable.yml"
      - ".github/workflows/install-e2e-build.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    uses: ./.github/workflows/install-e2e-build.yml
    permissions:
      contents: read
      packages: write

  cells:
    needs: prepare
    uses: ./.github/workflows/install-e2e-reusable.yml
    permissions:
      contents: read
      packages: read
    with:
      cells: '["zip-sqlite","zip-mariadb","docker-sqlite","docker-mariadb"]'
      image: ghcr.io/wegotworkspace/wegotworkspace-candidate@${{ needs.prepare.outputs.amd64_digest }}

  upgrade:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade v0.1.99 onto the candidate image
        env:
          WGW_UPGRADE_TO_IMAGE: ghcr.io/wegotworkspace/wegotworkspace-candidate@${{ needs.prepare.outputs.amd64_digest }}
        run: bash tools/e2e-upgrade.sh

  cleanup:
    needs: [prepare, cells, upgrade]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete candidate tags older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ghcr-delete-old-candidates.sh
