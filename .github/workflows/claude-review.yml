name: Claude review

# Reviewer half of the automated review loop. The fixer is claude-fix.yml.
#
#   ready for review ─▶ review ─▶ APPROVE ─────────▶ label ready-for-human (done)
#                         ▲   └─▶ REQUEST_CHANGES ─▶ claude-fix.yml ─▶ push ─┐
#                         └──────────────── synchronize by claude[bot] ◀────┘
#
# The fixer stops after MAX_ROUNDS change requests and labels needs-human.
# Marking the PR draft and then ready again starts a fresh cycle.
#
# Auth: no github_token input, so the action runs as the Claude GitHub App.
# Events made with GITHUB_TOKEN never start workflows; that would break the loop.
# The App token exchange also refuses workflow files that differ from main, so
# edits to this file only take effect once merged, and a PR cannot rewrite the
# loop it is judged by. Prompts are read from origin/main for the same reason.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BOT: claude[bot]
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write # create the loop labels
      id-token: write # Claude App token exchange
    steps:
      # New commits void an earlier approval. A human push only does this:
      # re-review is opt-in (draft, then ready) to save subscription limits.
      - name: Reset labels
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          gh pr edit "$PR" --remove-label ready-for-human 2>/dev/null || true
          if [ "$ACTION" = synchronize ] && [ "$SENDER" != "$BOT" ]; then
            echo "Push by $SENDER: approval dropped, no automatic re-review."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ACTION" != synchronize ]; then
            gh pr edit "$PR" --remove-label needs-human 2>/dev/null || true
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Turbo
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-claude-review-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.HEAD_SHA }}
          restore-keys: |
            ${{ runner.os }}-turbo-claude-review-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-apps-quality-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install JS workspace
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # Fast side only (typecheck + Vitest unit, ~25s locally). The PHP suite,
      # jsdom, Storybook, and e2e stay in CI, which runs alongside this review.
      - name: Fast JS suite
        id: tests
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec turbo run typecheck test:unit --filter=@wgw/apps 2>&1 \
            | tee "$RUNNER_TEMP/fast-suite.log"

      # Everything the reviewer gets besides the code. The PR body is left out
      # on purpose; only the issues it links are passed on.
      - name: Build prompt
        id: prompt
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ steps.tests.outcome }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          out="$RUNNER_TEMP/prompt.md"
          git show "origin/main:.github/review-loop/review-prompt.md" > "$out"

          # shellcheck disable=SC2016 # $owner etc. are GraphQL variables
          issues=$(gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 10) { nodes { url } }
                }
              }
            }' --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].url')
          # Fallback: issue number in the branch name (feat/1533-slug).
          if [ -z "$issues" ] && [[ "$HEAD_REF" =~ ^[a-z]+/([0-9]+)- ]]; then
            issues="https://github.com/$GH_REPO/issues/${BASH_REMATCH[1]}"
          fi

          {
            echo
            echo "## Context"
            echo
            echo "- Repository: $GH_REPO"
            echo "- PR: $PR (head $HEAD_SHA, base $BASE_REF)"
            echo
            echo "### Linked issues"
            echo
            if [ -z "$issues" ]; then
              echo "None linked. Review for the blocking categories only."
            fi
            for url in $issues; do
              echo "#### $url"
              echo
              gh issue view "$url" --json title,body --jq '"**" + .title + "**\n\n" + .body' \
                || echo "(not readable from this workflow)"
              echo
            done
            echo "### Fast JS suite: $TESTS"
            echo
            if [ "$TESTS" != success ]; then
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/fast-suite.log" | tail -n 150
              echo '```'
            fi
            echo
            echo "### Your earlier reviews on this PR"
            echo
            gh api "repos/$GH_REPO/pulls/$PR/reviews" --paginate --slurp \
              | jq -r --arg bot "$BOT" '[add[] | select(.user.login == $bot and .state != "COMMENTED")] | if length == 0
                  then "None. This is the first round."
                  else map("#### \(.state) on \(.commit_id[0:7])\n\n\(.body)") | join("\n\n") end'
          } >> "$out"

          delim="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delim"; cat "$out"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The fixer pushes as claude[bot]; without this the action refuses
          # that synchronize event and the loop never closes.
          allowed_bots: claude
          classify_inline_comments: false
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr review:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git push:*),Bash(git commit:*)"

      - name: Label the verdict
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GH_REPO/pulls/$PR/reviews" --paginate --slurp \
            | jq -r --arg bot "$BOT" --arg sha "$HEAD_SHA" \
              '[add[] | select(.user.login == $bot and .commit_id == $sha and .state != "COMMENTED")] | last | .state // ""')
          case "$state" in
            APPROVED)
              gh label create ready-for-human --color 0e8a16 \
                --description "Claude review approved; ready for human review" 2>/dev/null || true
              gh pr edit "$PR" --add-label ready-for-human
              ;;
            CHANGES_REQUESTED)
              echo "Changes requested; claude-fix.yml takes over."
              ;;
            *)
              echo "::error::Reviewer ended without APPROVE or REQUEST_CHANGES on $HEAD_SHA (got '${state:-nothing}')."
              exit 1
              ;;
          esac
