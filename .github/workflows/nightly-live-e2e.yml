name: Live E2E (Nightly)

# Live Playwright specs and the real-time chaos suite against the real API, SQLite, and Vite.
# Not a pull-request check: schedule + manual dispatch only (issue #1022).
# The live config boots host PHP on :9080 and Vite on :5173 (same path as `pnpm dev`).
# There is no Slack or email secret in this repo. A failed run uploads traces and
# opens or comments on a GitHub issue titled "Nightly live e2e failed".

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-live-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-specs:
    name: Live Playwright specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WGW_DISABLE_LOGIN_THROTTLE: "1"
      WGW_PROXY_TARGET: http://127.0.0.1:9080
      VITE_WGW_USE_LIVE_API: "1"
      VITE_WGW_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env
        run: |
          cp packages/api/.env.example packages/api/.env
          # The example is production-safe. This job is a local dev bootstrap.
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' packages/api/.env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm --filter @wgw/apps exec playwright install chromium --with-deps
          else
            pnpm --filter @wgw/apps exec playwright install chromium
          fi

      - name: Bootstrap local dev install
        run: php packages/api/artisan wgw:dev-install

      - name: Run live e2e specs
        working-directory: packages/apps
        run: pnpm exec playwright test --config playwright.live.config.mjs

      - name: Run real-time chaos specs
        working-directory: packages/apps
        run: pnpm exec playwright test --config playwright.chaos.config.mjs

      - name: Run relay e2e specs
        run: bash tools/coturn/run-relay-e2e.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-artifacts
          path: |
            packages/apps/playwright-report/
            packages/apps/test-results/
          if-no-files-found: ignore

      - name: Upload coturn logs
        if: failure()
        run: docker logs wgw-coturn > coturn.log 2>&1 || true

      - name: Upload coturn log artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coturn-logs
          path: coturn.log
          if-no-files-found: ignore

  sync-matrix:
    # The Notes matrix needs about 90 minutes on one runner for its 110 cases,
    # the Tasks matrix about 65 minutes for its 152, so each runs in 4 shards.
    # Each shard boots its own PHP, Vite, and SQLite, so the shards share nothing.
    name: ${{ matrix.app }} sync matrix (${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: Notes, spec: notes-sync-matrix, shards: 4, shard: 1 }
          - { app: Notes, spec: notes-sync-matrix, shards: 4, shard: 2 }
          - { app: Notes, spec: notes-sync-matrix, shards: 4, shard: 3 }
          - { app: Notes, spec: notes-sync-matrix, shards: 4, shard: 4 }
          - { app: Tasks, spec: tasks-sync-matrix, shards: 4, shard: 1 }
          - { app: Tasks, spec: tasks-sync-matrix, shards: 4, shard: 2 }
          - { app: Tasks, spec: tasks-sync-matrix, shards: 4, shard: 3 }
          - { app: Tasks, spec: tasks-sync-matrix, shards: 4, shard: 4 }
    env:
      WGW_DISABLE_LOGIN_THROTTLE: "1"
      WGW_PROXY_TARGET: http://127.0.0.1:9080
      VITE_WGW_USE_LIVE_API: "1"
      VITE_WGW_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, json, mbstring, pdo, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache Composer vendor
        uses: actions/cache@v6
        with:
          path: packages/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend Composer dependencies
        run: composer --working-dir packages/api install --no-interaction --prefer-dist

      - name: Prepare Laravel env
        run: |
          cp packages/api/.env.example packages/api/.env
          # The example is production-safe. This job is a local dev bootstrap.
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' packages/api/.env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' packages/api/.env
          php packages/api/artisan key:generate --force --no-interaction

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm --filter @wgw/apps exec playwright install chromium --with-deps
          else
            pnpm --filter @wgw/apps exec playwright install chromium
          fi

      - name: Bootstrap local dev install
        run: php packages/api/artisan wgw:dev-install

      - name: Run the ${{ matrix.app }} sync matrix
        working-directory: packages/apps
        run: pnpm exec playwright test --config playwright.matrix.config.mjs ${{ matrix.spec }} --shard=${{ matrix.shard }}/${{ matrix.shards }}

      # Also on a timeout (a cancel), so a slow run still leaves its traces.
      - name: Upload Playwright artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.spec }}-artifacts-${{ matrix.shard }}
          path: |
            packages/apps/playwright-report/
            packages/apps/test-results/
          if-no-files-found: ignore

  notify-failure:
    name: Notify on failure
    needs: [live-specs, sync-matrix]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or comment on the failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Nightly live e2e failed";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The nightly live Playwright workflow failed.",
              "",
              `Run: ${runUrl}`,
              "",
              "Download the `live-e2e-artifacts`, `notes-sync-matrix-artifacts-<shard>` or `tasks-sync-matrix-artifacts-<shard>` artifact from that run for the HTML report and traces.",
            ].join("\n");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({ owner, repo, title, body });
            core.info(`Opened #${created.data.number}`);

  notify-recovery:
    name: Close failure issue on success
    needs: [live-specs, sync-matrix]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment and close the open failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Nightly live e2e failed";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) {
              core.info("No open nightly failure issue.");
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Nightly live e2e recovered.\n\nRun: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: "closed",
              state_reason: "completed",
            });
            core.info(`Closed #${existing.number}`);
