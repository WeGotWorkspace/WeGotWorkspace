name: Restrict external issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  enforce-maintainer-only-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Close Goal/Epic/Task/Chore from non-maintainers
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const association = issue.author_association;
            const allowed = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            if (allowed.has(association)) {
              core.info(`Allowing ${association} author`);
              return;
            }

            const labels = (issue.labels || []).map((l) => l.name);
            // External bug and security/DAST reports stay open.
            if (
              labels.includes('bug') ||
              labels.includes('security') ||
              labels.includes('dast')
            ) {
              core.info('Allowing bug/security/dast issue from external');
              return;
            }

            const restricted = ['type:goal', 'type:epic', 'type:task', 'type:chore'];
            const hit = restricted.filter((name) => labels.includes(name));
            if (hit.length === 0) {
              core.info('No restricted labels; leaving issue alone');
              return;
            }

            const body = [
              'Thanks for your interest in WeGotWorkspace.',
              '',
              '**Goals, Epics, Tasks, and Chores are maintainer-filed only.**',
              '',
              'Please use:',
              '- [Discussions](https://github.com/WeGotWorkspace/wegotworkspace/discussions) for ideas and exploration (maintainers may promote promising threads to Goals)',
              '- The [Bug report](https://github.com/WeGotWorkspace/wegotworkspace/issues/new?template=bug-report.yml) template for defects',
              '',
              'See [CONTRIBUTING.md](https://github.com/WeGotWorkspace/wegotworkspace/blob/main/CONTRIBUTING.md).',
              '',
              `_Closed automatically (author association: \`${association}\`, labels: ${hit.map((l) => `\`${l}\``).join(', ')})._`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

            core.info(`Closed issue #${issue.number} from ${association}`);
