name: Install e2e cells

on:
  workflow_call:
    inputs:
      cells:
        description: JSON array of cell ids. Must be non-empty; an empty fromJSON matrix fails the workflow.
        required: true
        type: string
      image:
        description: Candidate image reference, including @sha256 digest
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cells:
    if: inputs.cells != '' && inputs.cells != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(inputs.cells) }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        if: matrix.cell != 'upgrade-from-v0.1.99'
        with:
          php-version: "8.3"
          extensions: ctype, dom, iconv, imap, json, mbstring, pdo, pdo_mysql, pdo_sqlite, simplexml, zip
          coverage: none

      - uses: pnpm/action-setup@v6.1.0
        if: matrix.cell != 'upgrade-from-v0.1.99'

      - uses: actions/setup-node@v7
        if: matrix.cell != 'upgrade-from-v0.1.99'
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/setup-node@v7
        if: matrix.cell == 'upgrade-from-v0.1.99'
        with:
          node-version: "24"

      - name: Install JS workspace
        if: matrix.cell != 'upgrade-from-v0.1.99'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        if: matrix.cell != 'upgrade-from-v0.1.99'
        run: pnpm --filter @wgw/api-e2e exec playwright install chromium --with-deps

      - name: Download the release ZIP
        if: matrix.cell != 'upgrade-from-v0.1.99'
        uses: actions/download-artifact@v8
        with:
          name: wegotworkspace-deploy-zip
          path: dist/releases

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run install cell
        if: matrix.cell != 'upgrade-from-v0.1.99'
        env:
          CHANNEL: ${{ startsWith(matrix.cell, 'docker') && 'docker' || 'zip' }}
          DB: ${{ endsWith(matrix.cell, 'mariadb') && 'mariadb' || 'sqlite' }}
          WGW_INSTALL_E2E_IMAGE: ${{ inputs.image }}
        run: bash tools/e2e-install-matrix.sh

      - name: Run upgrade cell
        if: matrix.cell == 'upgrade-from-v0.1.99'
        env:
          WGW_UPGRADE_TO_IMAGE: ${{ inputs.image }}
        run: bash tools/e2e-upgrade-from-v0.1.99.sh

      - name: Job summary
        if: always()
        run: |
          echo "### ${{ matrix.cell }}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record cell status
        if: always()
        run: echo "${{ matrix.cell }} ${{ job.status }}" > "${{ matrix.cell }}.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: install-e2e-cell-${{ matrix.cell }}
          path: ${{ matrix.cell }}.txt
          retention-days: 3

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.cell }}
          path: tools/api-e2e/test-results
          retention-days: 3
          if-no-files-found: ignore
