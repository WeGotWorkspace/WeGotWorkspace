name: Review loop - review

# Reviewer half of the automated review loop; the fixer is review-loop-fix.yml.
# Setup, vendor swap, and design notes: .github/review-loop/README.md.
#
#   ready for review ─▶ review ─▶ approve ──────────▶ label ready-for-human
#                         ▲   └─▶ request changes ─▶ fix ─▶ signed commit ─┐
#                         └──────────────── push by the loop bot ◀────────┘
#
# The agent only reads code and returns JSON. The job posts the review as the
# loop's own GitHub App, whose events start workflows (GITHUB_TOKEN events do
# not, which would break the loop).
#
# This file only decides when to run. GitHub reads it from the PR's test merge,
# which can lag behind main, so the logic lives in review-loop-review-job.yml,
# called at @main. That job reads the prompts, schemas, adapter, and standards
# from main too, so a PR cannot rewrite the reviewer that judges it.

on:
  pull_request:
    # labeled: only the re-review label starts a review (a person asking for
    # one without the draft/ready round trip, which drops auto-merge).
    types: [opened, ready_for_review, reopened, synchronize, labeled]

# Any other label gets a group of its own, so the loop's own hand-over labels
# never cancel a review that is running.
concurrency:
  group: >-
    review-loop-review-${{
      github.event.action == 'labeled' && github.event.label.name != 're-review' &&
      github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Runs Dependabot starts get no Actions secrets, so the gate cannot get the
    # loop's app token and would fail. Skip them. To review a Dependabot PR, a
    # person marks it draft and then ready: that event is theirs, so the run
    # gets the secrets.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 're-review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: WeGotWorkspace/WeGotWorkspace/.github/workflows/review-loop-review-job.yml@main
    secrets: inherit
