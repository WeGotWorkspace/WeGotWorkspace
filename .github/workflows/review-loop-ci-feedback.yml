name: Review loop - CI feedback

# Sends a red CI run on an approved loop PR back to the fixer. The reviewers
# cannot run the PHP suite, MySQL, or e2e, so an approval can still fail CI,
# which runs once the loop adds ready-for-human. This posts a change request
# from the loop bot that lists the failed jobs with a log excerpt. That starts
# a normal fix round, which counts toward REVIEW_LOOP_MAX_ROUNDS.
#
# workflow_run always runs this file from main. It checks out no code; the
# log text from the PR's run only goes into the review body, inside code
# blocks, as review text does today.
# Design notes: .github/review-loop/README.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: review-loop-ci-feedback-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  feedback:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.REVIEW_LOOP_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The loop's app cannot read Actions logs; this job's token can.
      actions: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ vars.REVIEW_LOOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_LOOP_APP_PRIVATE_KEY }}

      - name: Send the failure to the fixer
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          LOG_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
            | jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.state == "open" and .head.sha == $sha)][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR has $HEAD_SHA as its head; nothing to do."
            exit 0
          fi
          # Only a hand-over the loop approved, on the commit it approved.
          # needs-human means the loop already stopped; a human push removes
          # ready-for-human, and a newer head makes this run stale.
          if ! gh api "repos/$GH_REPO/pulls/$pr" | jq -e --arg sha "$HEAD_SHA" '
              .head.sha == $sha and (.draft | not)
              and any(.labels[]; .name == "ready-for-human")' > /dev/null; then
            echo "PR #$pr is not an approved loop hand-over at $HEAD_SHA; nothing to do."
            exit 0
          fi

          jobs=$(GH_TOKEN=$LOG_TOKEN gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            | jq -rs '[.[].jobs[] | select(.conclusion == "failure")][0:5][]
                | "\(.id)\t\(.html_url)\t\(.name)"')
          if [ -z "$jobs" ]; then
            echo "The run failed, but no job did; nothing for the fixer."
            exit 0
          fi

          # The excerpt is PR output: keep it inside the code block (no
          # backtick fences) and never let it carry the loop's markers.
          body="$RUNNER_TEMP/body.md"
          {
            echo "CI failed on the approved head (\`${HEAD_SHA:0:9}\`, [run]($RUN_URL)). The loop sends it back for a fix round."
            echo
            n=0
            while IFS=$'\t' read -r id url name; do
              n=$((n + 1))
              echo "$n. **\`$name\` failed** ([log]($url)). Find the cause in this change and fix it."
              echo
              excerpt=$(GH_TOKEN=$LOG_TOKEN gh run view --job "$id" --log-failed 2>/dev/null \
                | cut -f3- \
                | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//; s/\x1b\[[0-9;]*m//g' \
                | grep -vE '^##\[(group|endgroup)\]' \
                | tail -n 60 | cut -c1-300 \
                | sed -e 's/```/'"'''"'/g' -e 's/<!-- review-loop:/<!-- review loop:/g' -e 's/^/   /' \
                || true)
              if [ -n "$excerpt" ]; then
                echo '   ```text'
                echo "$excerpt"
                echo '   ```'
                echo
              else
                printf '   No log of the failed steps could be read; open the link.\n\n'
              fi
            done <<< "$jobs"
            echo "A failure that is clearly the environment or unrelated to this change: change nothing and say why."
          } > "$body"

          gh pr edit "$pr" --remove-label ready-for-human
          jq -n --arg sha "$HEAD_SHA" --rawfile body "$body" \
            '{commit_id: $sha, event: "REQUEST_CHANGES", body: ($body | .[0:60000])}' \
            | gh api -X POST "repos/$GH_REPO/pulls/$pr/reviews" --input - > /dev/null
          echo "Sent $n failed job(s) on #$pr to the fixer."
