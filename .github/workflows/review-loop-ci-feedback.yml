name: Review loop - CI feedback

# Sends a red CI run on an approved loop PR back to the fixer. The reviewers
# cannot run the PHP suite, MySQL, or e2e, so an approval can still fail CI,
# which runs once the loop adds ready-for-human. This posts a change request
# from the loop bot that lists the failed jobs with a log excerpt. That starts
# a normal fix round, which counts toward REVIEW_LOOP_MAX_ROUNDS.
#
# workflow_run always runs this file from main. It checks out no code; the
# log text from the PR's run only goes into the review body, inside code
# blocks, as review text does today.
# Design notes: .github/review-loop/README.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: review-loop-ci-feedback-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  feedback:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.REVIEW_LOOP_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # A first failure is re-run once and watched to the end (CI takes about
    # 25 minutes), so this job waits on it.
    timeout-minutes: 75
    permissions:
      # The loop's app cannot read Actions logs or re-run jobs; this job's
      # token can.
      actions: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ vars.REVIEW_LOOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_LOOP_APP_PRIVATE_KEY }}

      - name: Send the failure to the fixer
        # shell: bash adds pipefail, so a failed API call fails the step
        # instead of reading as "nothing to do".
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          LOG_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          pr=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
            | jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.state == "open" and .head.sha == $sha)][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR has $HEAD_SHA as its head; nothing to do."
            exit 0
          fi

          # Only a hand-over the loop approved, on the commit it approved.
          # needs-human means the loop already stopped; a human push removes
          # ready-for-human, and a newer head makes this run stale. Checked
          # again right before posting, since reading the logs takes time.
          # A failed read stops the step; only the answer may say "no".
          handed_over() {
            local pull
            pull=$(gh api "repos/$GH_REPO/pulls/$pr") || exit 1
            jq -e --arg sha "$HEAD_SHA" '
              .head.sha == $sha and (.draft | not)
              and any(.labels[]; .name == "ready-for-human")' <<< "$pull" > /dev/null
          }
          if ! handed_over; then
            echo "PR #$pr is not an approved loop hand-over at $HEAD_SHA; nothing to do."
            exit 0
          fi

          # A flaky test should not cost an approval: re-run the failed jobs
          # once and only send the failure on when it fails again. The run is
          # watched here, because a re-run started with this job's token may
          # not start this workflow again when it completes. If it does, that
          # second feedback run finds the hand-over label gone or the run green.
          if [ "$RUN_ATTEMPT" = 1 ] && GH_TOKEN=$LOG_TOKEN gh run rerun "$RUN_ID" --failed; then
            echo "Re-running the failed jobs of run $RUN_ID once."
            sleep 60
            if GH_TOKEN=$LOG_TOKEN gh run watch "$RUN_ID" --exit-status --interval 60 > /dev/null; then
              echo "The re-run passed; the approval stands."
              exit 0
            fi
            echo "The re-run failed too; sending it to the fixer."
            if ! handed_over; then
              echo "PR #$pr changed during the re-run; nothing to do."
              exit 0
            fi
          fi

          # A job past its timeout-minutes ends as timed_out. The name is PR
          # output too: one line, no backtick, no loop marker.
          jobs=$(GH_TOKEN=$LOG_TOKEN gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            | jq -rs '[.[].jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")][0:5][]
                | "\(.id)\t\(.html_url)\t\(.name | gsub("[\\t\\r\\n`]"; " ") | gsub("<!-- review-loop:"; "<!-- review loop:"))"')
          if [ -z "$jobs" ]; then
            echo "::warning::CI run $RUN_ID failed, but no job failed or timed out; nothing for the fixer."
            exit 0
          fi

          # The excerpt is PR output: keep it inside the code block (no
          # backtick fences) and never let it carry the loop's markers. 20
          # failure lines plus a 20-line tail of 200 characters per job keep
          # five jobs well under the review body limit.
          FAILURE_LINES='(^| )FAIL( |$)|FAILED|AssertionError|^##\[error\]|^ *[✗×] |exit(ed)? (code |\()[1-9]|heap out of memory'
          NOT_FAILURE_LINES='✔|✓|^##\[error\](Process completed|A job that)'
          body="$RUNNER_TEMP/body.md"
          n=0
          {
            echo "CI failed on the approved head (\`${HEAD_SHA:0:9}\`, [run]($RUN_URL)). The loop sends it back for a fix round."
            echo
            while IFS=$'\t' read -r id url name; do
              [[ "$id" =~ ^[0-9]+$ ]] || continue
              n=$((n + 1))
              echo "$n. **\`$name\` failed** ([log]($url)). Find the cause in this change and fix it."
              echo
              log="$RUNNER_TEMP/job-$id.log"
              GH_TOKEN=$LOG_TOKEN gh run view --job "$id" --log-failed 2>/dev/null \
                | cut -f3- \
                | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//; s/\x1b\[[0-9;]*m//g; s/\^\[\[[0-9;]*m//g' \
                | grep -vE '^##\[(group|endgroup)\]' > "$log" || true
              # The failing test often sits far above the log's tail (the
              # done gate keeps running other suites after a failure), so the
              # failure lines come first, then the tail.
              excerpt=$({
                  grep -E "$FAILURE_LINES" "$log" | grep -vE "$NOT_FAILURE_LINES" | head -n 20 || true
                  echo '...'
                  tail -n 20 "$log"
                } | cut -c1-200 \
                | sed -e 's/```/'"'''"'/g' -e 's/<!-- review-loop:/<!-- review loop:/g' -e 's/^/   /' \
                || true)
              [ -s "$log" ] || excerpt=""
              if [ -n "$excerpt" ]; then
                echo '   ```text'
                echo "$excerpt"
                echo '   ```'
                echo
              else
                printf '   No log of the failed steps could be read; open the link.\n\n'
              fi
            done <<< "$jobs"
            echo "A failure that is clearly the environment or unrelated to this change: change nothing and say why."
          } > "$body"
          if [ "$n" -eq 0 ]; then
            echo "::warning::No failed job had a usable id; nothing for the fixer."
            exit 0
          fi

          if ! handed_over; then
            echo "PR #$pr changed while the logs were read; nothing to do."
            exit 0
          fi
          # Post first: if this fails, the label stays and a re-run can send
          # the failure again. The review gate drops ready-for-human on every
          # review run anyway, so a failed removal only leaves it until then.
          jq -n --arg sha "$HEAD_SHA" --rawfile body "$body" \
            '{commit_id: $sha, event: "REQUEST_CHANGES", body: $body}' \
            | gh api -X POST "repos/$GH_REPO/pulls/$pr/reviews" --input - > /dev/null
          gh pr edit "$pr" --remove-label ready-for-human \
            || echo "::warning::Could not remove ready-for-human from #$pr; the next review run does."
          echo "Sent $n failed job(s) on #$pr to the fixer."
