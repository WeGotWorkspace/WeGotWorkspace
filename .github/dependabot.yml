# Weekly version updates. Each ecosystem is one group covering major, minor,
# and patch, so Dependabot opens a single version-update pull request per
# ecosystem. `applies-to: version-updates` keeps security updates ungrouped
# so they are not held for the weekly batch.
#
# Follow-up (turbo-hybrid): root `npm` only sees pnpm-lock.yaml. If packages/api
# or tools/api-e2e later gets its own package.json and lockfile, add another npm
# directory entry. packages/api is Composer-only today; tools/api-e2e is still
# in the root workspace (pnpm-workspace.yaml).
version: 2
updates:
  - package-ecosystem: composer
    directory: /packages/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      composer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    ignore:
      # TypeScript 7.0 is the native compiler and does not ship the JS compiler
      # API. openapi-typescript and Storybook react-docgen still call
      # ts.factory / ts.sys, and typescript-eslint 8 peers on typescript <6.1.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # These majors change lint rules or public types the apps package still
      # targets. Hold them until a dedicated upgrade.
      - dependency-name: eslint
        versions:
          - ">=10.0.0"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10.0.0"
      - dependency-name: eslint-plugin-react-hooks
        versions:
          - ">=6.0.0"
      - dependency-name: vite
        versions:
          - ">=8.0.0"
      - dependency-name: "@vitejs/plugin-react"
        versions:
          - ">=6.0.0"
      - dependency-name: vitest
        versions:
          - ">=5.0.0"
      - dependency-name: "@vitest/browser-playwright"
        versions:
          - ">=5.0.0"
      - dependency-name: recharts
        versions:
          - ">=3.0.0"
      - dependency-name: react-day-picker
        versions:
          - ">=10.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  # Docker base-image index digests under docker/install.
  - package-ecosystem: docker
    directory: /docker/install
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
