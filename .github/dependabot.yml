# Weekly version updates. npm majors are their own group so a breaking bump
# does not ride along with the minor and patch batch. Other ecosystems stay
# one group covering major, minor, and patch. `applies-to: version-updates`
# keeps security updates ungrouped so they are not held for the weekly batch.
#
# Follow-up (turbo-hybrid): root `npm` only sees pnpm-lock.yaml. If packages/api
# or tools/api-e2e later gets its own package.json and lockfile, add another npm
# directory entry. packages/api is Composer-only today; tools/api-e2e is still
# in the root workspace (pnpm-workspace.yaml).
version: 2
updates:
  - package-ecosystem: composer
    directory: /packages/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      composer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Held majors are tracked in #968. Remove an ignore only in the PR that
    # upgrades that package.
    ignore:
      # The pnpm override pins typescript to 5.9.3. A 6.x bump would change
      # package.json and leave the lockfile on 5.9.3. typescript-eslint 8
      # peers on typescript <6.1, and TypeScript 7 does not ship the JS
      # compiler API (ts.factory / ts.sys) that openapi-typescript and
      # Storybook react-docgen still call.
      - dependency-name: typescript
        versions:
          - ">=6.0.0"
      # These majors change lint rules or public types the apps package still
      # targets. Hold them until a dedicated upgrade.
      - dependency-name: eslint
        versions:
          - ">=10.0.0"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10.0.0"
      - dependency-name: eslint-plugin-react-hooks
        versions:
          - ">=6.0.0"
      - dependency-name: vite
        versions:
          - ">=8.0.0"
      - dependency-name: "@vitejs/plugin-react"
        versions:
          - ">=6.0.0"
      - dependency-name: vitest
        versions:
          - ">=5.0.0"
      - dependency-name: "@vitest/browser-playwright"
        versions:
          - ">=5.0.0"
      - dependency-name: "@vitest/coverage-v8"
        versions:
          - ">=5.0.0"
      - dependency-name: recharts
        versions:
          - ">=3.0.0"
      - dependency-name: react-day-picker
        versions:
          - ">=10.0.0"
      # 2.3 leaves the listbox open across the next query, so getByRole
      # misses the dialog button while the rest of the dialog is hidden.
      - dependency-name: "@radix-ui/react-select"
        versions:
          - ">=2.3.0"
      # CI runs Node 24. Node 25 and 26 types accept APIs that runtime does
      # not have.
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
      # 1.170 treats a Node process as a server and skips client navigate(),
      # which fails route unit tests and races Storybook play functions.
      # package.json also pins seroval-plugins to 1.5.2. main already
      # resolves 1.5.2 while the router stays on 1.168.23; 1.6.7 imports
      # isStream, which the seroval 1.5.3 override does not export. Remove
      # that override when this hold is lifted.
      - dependency-name: "@tanstack/react-router"
        versions:
          - ">=1.169.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  # Docker base-image index digests under docker/install.
  - package-ecosystem: docker
    directory: /docker/install
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
