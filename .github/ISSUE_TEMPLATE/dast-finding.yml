name: DAST finding
description: Report a dynamic application security finding from OWASP ZAP
labels:
  - security
  - dast
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        If this finding is not yet public, report it the way [SECURITY.md](https://github.com/WeGotWorkspace/wegotworkspace/blob/main/SECURITY.md) describes. Do not use this template.

        This template is only for a finding that is already public. The security workflow does not file these issues. It may do so only after authenticated DAST is enabled.
        Write the finding in **English**.

  - type: textarea
    id: alert
    attributes:
      label: ZAP alert
      description: Alert name and risk level from the ZAP report
      placeholder: "Cross Site Scripting (Reflected) — High"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Affected URL
      placeholder: "https://staging.example.com/drive/"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Paste the ZAP finding description or remediation hint
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow run (optional)
      description: Link to a GitHub Actions run, if one produced this finding
