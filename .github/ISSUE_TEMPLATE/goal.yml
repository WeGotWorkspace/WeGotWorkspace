name: Goal
description: Product Goal — a user outcome for the Product roadmap (maintainers only for now)
title: "[Goal] "
labels:
  - type:goal
body:
  - type: markdown
    attributes:
      value: |
        Use this template for **user-facing outcomes** (Goals), not engineering tasks.
        Titles should be verb outcomes — e.g. “Share Docs and Drive files with guests via a link”.

        Community goal proposals are **not open yet** (legal entity pending). Maintainers only.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What can the user do when this Goal is achieved? Plain language; no REST endpoints or package paths.
      placeholder: Users can share a Drive file or Doc with a guest via a link, without creating an account.
    validations:
      required: true

  - type: textarea
    id: who
    attributes:
      label: Who it's for
      description: Persona / context (self-hosted admin, end user, guest, etc.).
      placeholder: End users on a self-hosted instance; guests who receive a share link.
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: Success looks like
      description: Observable success signals a non-technical reader can check. Not implementer AC checkboxes.
      placeholder: |
        - A signed-in user can create a share link for a file or doc
        - A guest can open the link and view (or edit, if allowed) without logging in
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What this Goal explicitly does not include.
      placeholder: Full public wiki hosting; anonymous upload into arbitrary folders.
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Soft product status (also set on the Product roadmap Project).
      options:
        - Exploring
        - Proposed
        - Accepted
        - Building
        - Shipped
    validations:
      required: true

  - type: input
    id: target_release
    attributes:
      label: Soft target release (optional)
      description: Maintainer hint only — milestones stay on child delivery issues.
      placeholder: e.g. v0.9
    validations:
      required: false

  - type: textarea
    id: decisions
    attributes:
      label: Decisions (optional)
      description: Contested or easy-to-re-litigate product decisions. Skip if none.
      placeholder: Guest sharing is a must-have for v0.9; password-protected links are in scope.
    validations:
      required: false

  - type: textarea
    id: delivery
    attributes:
      label: Delivery (maintainers)
      description: Links to child epics/tasks only — no eng detail here.
      placeholder: |
        - Epic: #…
        - Task: #…
    validations:
      required: false
