name: "[Maintainers only] Epic"
description: "Maintainers only — engineering epic under a parent Goal. Externals: use Discussions or Bug report."
type: Task
labels:
  - type:epic
body:
  - type: markdown
    attributes:
      value: |
        **Maintainers only.** External contributors: please open a [Discussion](https://github.com/WeGotWorkspace/wegotworkspace/discussions)
        for ideas, or a Bug report for defects. Issues filed via this template by non-maintainers are closed automatically.

        Epics are **engineering** work under a product Goal. Link the parent Goal.
        Do not start the title with `[Epic]`. The GitHub issue type is Task; the label stays `type:epic`.
        **Write the entire issue in English**, even if the conversation that produced it was in another language.
        Do not put epics on the Product roadmap Project.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >
        For the product lead, in plain English (B1), no code or file names.
        Three short lines: what changes, who notices, and what happens if we wait.
        See .agents/skills/developer/plain-language.md.
      value: |
        **What:**
        **Who notices:**
        **If we wait:**
    validations:
      required: true

  - type: textarea
    id: parent_goal
    attributes:
      label: Parent goal
      description: Link to the Goal in WeGotWorkspace/Product this epic delivers. Also add this epic to that Goal as a sub-issue.
      placeholder: "WeGotWorkspace/Product#123 — Share Docs and Drive files with guests via a link"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this epic covers in eng terms (packages, surfaces, protocols OK here). Technical design moved out of the parent Goal lives here too, in a section that says where it came from.
    validations:
      required: true

  - type: textarea
    id: slices
    attributes:
      label: Slices
      description: Checklist of delivery slices / child tasks.
      placeholder: |
        - [ ] Slice A
        - [ ] Slice B
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicit exclusions for this epic.
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Maps to the parent Goal’s success signals; implementer DoD.
    validations:
      required: true
