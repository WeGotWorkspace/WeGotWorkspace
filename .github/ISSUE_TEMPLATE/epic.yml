name: Epic
description: Engineering epic — slices delivery under a parent Goal (maintainers)
title: "[Epic] "
labels:
  - type:epic
body:
  - type: markdown
    attributes:
      value: |
        Epics are **engineering** work under a product Goal. Link the parent Goal.
        Do not put epics on the Product roadmap Project.

  - type: textarea
    id: parent_goal
    attributes:
      label: Parent goal
      description: Link to the `type:goal` issue this epic delivers.
      placeholder: "#123 — Share Docs and Drive files with guests via a link"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this epic covers in eng terms (packages, surfaces, protocols OK here).
    validations:
      required: true

  - type: textarea
    id: slices
    attributes:
      label: Slices
      description: Checklist of delivery slices / child tasks.
      placeholder: |
        - [ ] Slice A
        - [ ] Slice B
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicit exclusions for this epic.
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Maps to the parent Goal’s success signals; implementer DoD.
    validations:
      required: true
