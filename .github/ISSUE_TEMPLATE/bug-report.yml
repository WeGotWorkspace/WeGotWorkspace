name: Bug report
description: Report something that is broken or not working correctly in WeGotWorkspace
type: Bug
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        Use this form to describe incorrect or broken behavior.

        For **ideas and exploration**, use [Discussions](https://github.com/WeGotWorkspace/wegotworkspace/discussions) instead —
        do not use this form to propose Goals or features. See CONTRIBUTING.md.
        Please write this report in **English**.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >
        Three short lines in plain words. What goes wrong.
        Who runs into it (just you, everyone, admins, guests).
        What happens if it stays broken (you lose work, you need a workaround, or it is only annoying).
        Keep the three labels and write after each one.
        Example — What: Pressing Enter in a table cell closes the document and my changes are gone.
        Who notices: Anyone who edits tables in Docs.
        If we wait: People lose work every time they press Enter in a table.
      value: |
        **What:**
        **Who notices:**
        **If we wait:**
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Details
      description: >
        Optional. Anything longer than one line about what goes wrong:
        error messages, when it started, what you already tried.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
      description: >
        Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Share clear steps we can follow to reproduce the issue.
        A minimal online reproduction is very helpful when available.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Product version
      description: >
        Optional: include the version you are using, if you know it.
      placeholder: e.g. v0.1.50
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: >
        Browser, OS, and any other relevant environment details.
      placeholder: e.g. Chrome 148, macOS 26
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: >
        Include screenshots, videos, logs, or anything else that could help us investigate.
    validations:
      required: false
