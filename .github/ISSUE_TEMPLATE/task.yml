name: Task — implementable AC
description: Delivery task with implementable acceptance criteria under a parent Epic or Goal
title: "[Task] "
labels:
  - type:task
body:
  - type: markdown
    attributes:
      value: |
        Tasks are **implementable** delivery work. Link a parent Epic or Goal.
        Acceptance criteria should be checkbox-ready (`- [ ]`) so agents and PRs can verify done.

        Do not put tasks on the Product roadmap Project.

  - type: textarea
    id: parent
    attributes:
      label: Parent Epic or Goal
      description: Link to the `type:epic` or `type:goal` issue this task delivers.
      placeholder: "#123 — Epic or Goal title"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: >
        Implementable checklist. Each item should be objectively verifiable
        (tests, UI behavior, API contract). Prefer `- [ ]` lines.
      placeholder: |
        - [ ] …
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicit exclusions for this task (scope fence).
      placeholder: Out of scope for this task — …
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Area (optional)
      description: Product area hint (mail, drive, docs, calendar, …). May also set an `area:*` label.
      placeholder: e.g. drive
    validations:
      required: false
