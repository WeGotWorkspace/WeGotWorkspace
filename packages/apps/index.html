<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The one iOS focus-zoom stop for the whole suite: iOS Safari zooms the page when
      a field or editor under 16px gets focus; `maximum-scale=1` stops that, so text
      keeps its desktop size on phones. iOS still allows pinch-zoom. Runtime HTML copies
      this tag (`readViewportMeta`); `pwa-document-shell.test.ts` guards it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Installed window chrome. Hexes match `WORKSPACE_PWA_THEME_COLORS`. -->
    <meta name="theme-color" content="#f6f7f9" />
    <!--
      Synchronous paint. iOS samples html/body background before module CSS and
      otherwise keeps an opaque status-bar gap. App CSS overrides the color.
    -->
    <style>
      html,
      body {
        background-color: #f6f7f9;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background-color: #0e1216;
      }
    </style>
    <script>
      if (
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches
      ) {
        document.documentElement.classList.add("pwa-standalone");
      }
    </script>
    <!-- Theme before first paint. Runtime HTML loads the same file. -->
    <script src="/assets/theme-boot.js"></script>
    <title>WeGotWorkspace</title>
    <link
      rel="preload"
      href="./fonts/PlusJakartaSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="./fonts/WeGotSerif-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="./fonts/JetBrainsMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
