# API/UI aliases for every vhost (HTTP, HTTPS, and :9080). Do not put these only in wgw-http-vhost —
# that conf is disabled when TLS certs are mounted.
#
# MCP OAuth discovery (RFC 8414 / 9728) is at the origin root
# (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource).
# DocumentRoot is the install shell, so those paths reach Laravel via index.php.
# Do not advertise discovery under Alias /api — MCP clients look at the origin.
#
# Origin-root PHP (index.php → WgwAppBootstrap) must load the bind-mounted
# packages/api, not a stale nested copy under /var/www/install/packages/api.
SetEnv WGW_API_ROOT /var/www/packages/api
Alias /api /var/www/packages/api/public
Alias /apps /var/www/packages/apps/dist
Alias /swagger /var/www/packages/api/public/swagger

# Shared directory policy for install docroot (all vhosts).
<Directory /var/www/install>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/packages/api/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/packages/apps/dist>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

LimitRequestBody 536870912
