# HTTP → HTTPS when mkcert certs are mounted (enabled in entrypoint).
<VirtualHost *:80>
    ServerName wegotworkspace.localhost
    DocumentRoot /var/www/install

    UseCanonicalName Off
    RewriteEngine On
    # Local Host only — never send a tunnel Host to wegotworkspace.localhost.
    RewriteCond %{HTTP_HOST} ^(wegotworkspace\.localhost|localhost)(:[0-9]+)?$ [NC]
    RewriteRule ^ https://wegotworkspace.localhost%{REQUEST_URI} [R=301,L,NE]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
