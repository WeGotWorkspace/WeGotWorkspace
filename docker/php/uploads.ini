; Conservative shared-host alignment (cPanel/Plesk often ship 32M or 64M).
; PHP's historic default is 8M; 32M is the typical-but-conservative pick.
; Keep upload_max_filesize <= post_max_size.
; display_errors=0 stops line-0 post_max_size warnings leaking HTML (index.php
; ini_set is too late). Values are lockstep-tested in UploadLimitParityTest.
post_max_size = 32M
upload_max_filesize = 32M
display_errors = 0
