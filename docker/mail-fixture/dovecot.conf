# Standalone Dovecot IMAP for local/CI mail tests. No SSL; PLAIN auth.
protocols = imap
listen = *, ::
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:~/
first_valid_uid = 1000
last_valid_uid = 1000
mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail
default_internal_user = vmail
default_login_user = vmail

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

service anvil {
  chroot = empty
}

service stats {
  unix_listener stats-reader {
    user = vmail
    group = vmail
    mode = 0660
  }
  unix_listener stats-writer {
    user = vmail
    group = vmail
    mode = 0660
  }
}

log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr
auth_verbose = yes
