; Conservative shared-host alignment. PHP-FPM / CGI read this from the
; document root (mod_php uses .htaccess php_value instead).
; Keep in sync with docker/php/uploads.ini (UploadLimitParityTest).
; display_errors must be here — index.php ini_set is too late for PHP's
; line-0 post_max_size warning.
post_max_size = 32M
upload_max_filesize = 32M
display_errors = 0
